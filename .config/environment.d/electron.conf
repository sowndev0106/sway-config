# Ép app Electron (Antigravity, VS Code, Discord, Slack...) chạy Wayland gốc.
# Mặc định Electron chạy qua XWayland -> thêm một lớp copy/đồng bộ khung, gây
# GIẬT khi cuộn/animation (rõ nhất trên máy Nvidia-primary, cùng bệnh với Chrome).
# Electron >= 28 đọc biến này: "auto" = dùng Wayland nếu đang trong session
# Wayland, không thì về X11 (an toàn cho cả máy chỉ-Intel).
#
# systemd user session đọc file này lúc đăng nhập -> cần ĐĂNG XUẤT đăng nhập lại
# (hoặc mở app từ shell mới) mới có hiệu lực.
ELECTRON_OZONE_PLATFORM_HINT=auto
