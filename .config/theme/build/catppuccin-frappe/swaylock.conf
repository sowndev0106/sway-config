# Sinh tự động bởi ~/.config/theme/theme.sh từ theme/templates/swaylock.conf — sửa
# file template đó rồi chạy `theme.sh build` (swaylock không hỗ trợ include nên
# ~/.config/swaylock/config là symlink tới bản sinh ra của theme đang dùng).
# swaylock — màn khóa (màu theo theme đang dùng)
# LƯU Ý: swaylock 1.7.x (Ubuntu 24.04) KHÔNG hỗ trợ clock/timestr/datestr (cần 1.8+).
ignore-empty-password
# (Không 'daemonize' và không 'image' ở đây: lock.sh tự lo nền blur + chạy foreground.
#  Khi swaylock chạy không có nền sẽ dùng 'color' bên dưới làm fallback an toàn.)

font=JetBrains Mono
indicator-idle-visible
indicator-radius=110
indicator-thickness=8

color=303446
inside-color=303446
inside-clear-color=414559
inside-ver-color=8caaee
inside-wrong-color=e78284
ring-color=8caaee
ring-clear-color=e5c890
ring-ver-color=8caaee
ring-wrong-color=e78284
key-hl-color=a6d189
bs-hl-color=e78284
line-color=00000000
separator-color=00000000
text-color=c6d0f5
text-clear-color=303446
text-ver-color=303446
text-wrong-color=303446
