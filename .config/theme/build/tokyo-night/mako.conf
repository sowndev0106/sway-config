# Sinh tự động bởi ~/.config/theme/theme.sh từ theme/templates/mako.conf — sửa
# file template đó rồi chạy `theme.sh build` (mako không hỗ trợ include nên
# ~/.config/mako/config là symlink tới bản sinh ra của theme đang dùng).
# mako notification daemon — man 5 mako
font=JetBrains Mono 10
background-color=#24283b
text-color=#c0caf5
border-color=#7aa2f7
border-size=2
border-radius=8
padding=10
margin=10
default-timeout=5000
anchor=top-right

[urgency=critical]
border-color=#f7768e
default-timeout=0
