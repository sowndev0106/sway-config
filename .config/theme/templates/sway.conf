# Sinh tự động bởi ~/.config/theme/theme.sh — KHÔNG sửa tay. sway/config include file này.
# Thứ tự: viền  nền-tiêu-đề  chữ  indicator  viền-con
# Màu thứ 4 (indicator) = đỏ để thấy được hướng split: cạnh đỏ là nơi window mới sẽ mở
client.focused          #{{accent}} #{{surface0}} #{{text}} #{{red}} #{{accent}}
client.unfocused        #{{mantle}} #{{mantle}} #{{overlay0}} #{{mantle}} #{{mantle}}
client.focused_inactive #{{surface1}} #{{base}} #{{subtext0}} #{{base}} #{{surface1}}
client.urgent           #{{red}} #{{red}} #{{base}} #{{red}} #{{red}}
