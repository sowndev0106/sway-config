# Icon phía trước tên cửa sổ trên thanh tiêu đề/tab (kiểu "thanh tối + icon màu").
#
# Sway KHÔNG vẽ được ảnh trong thanh tiêu đề, nên dùng icon dạng ký tự của JetBrainsMono
# Nerd Font, đặt bằng `title_format` (markup pango; cần `font pango:...` ở sway/config).
# Mỗi app cần 2 rule vì tiêu chí `app_id` (Wayland) và `class` (XWayland) không gộp được;
# regex không phân biệt hoa/thường. Rule đứng SAU thắng rule đứng trước, nên rule mặc định
# (icon app chung) nằm đầu, rule riêng từng app nằm sau.
#
# Thêm app mới: mở app đó rồi xem `swaymsg -t get_tree | grep -E 'app_id|class'`, sao chép
# 1 khối bên dưới và đổi regex + icon (bảng glyph: https://www.nerdfonts.com/cheat-sheet).
# Cửa sổ NỔI dùng viền pixel (default_floating_border) nên không có thanh tiêu đề -> không icon.

# Mặc định: mọi app chưa có rule riêng (nf-md-application)
for_window [app_id=".*"] title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#6c7086'>󰣆</span>   %title"
for_window [class=".*"]  title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#6c7086'>󰣆</span>   %title"

# Terminal (nf-fa-terminal)
for_window [app_id="(?i)^(foot|footclient|kitty|alacritty|wezterm|xterm|org\.codeberg\.dnkl\.foot)$"] title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#a6e3a1'></span>   %title"
for_window [class="(?i)^(foot|footclient|kitty|alacritty|wezterm|xterm|org\.codeberg\.dnkl\.foot)$"] title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#a6e3a1'></span>   %title"

