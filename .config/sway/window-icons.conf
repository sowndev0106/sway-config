# Microsoft Teams (nf-md-microsoft_teams) — Chrome PWA / teams-for-linux
# Only the plain icon lives here. The red "unread" dot is added at runtime by
# scripts/teams-unread-dot.py (it reads the app_id rule below, so keep that rule's format
# as the plain icon), because it must depend on what you have already seen, not only on
# the "(N)" that Teams keeps in the title.
for_window [app_id="(?i)^(chrome-ompifgpmddkgmclendfeacglnodjjndh-.*|teams-for-linux|teams|ms-teams)$"] title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#74c7ec'>󰊻</span>   %title"
for_window [class="(?i)^(chrome-ompifgpmddkgmclendfeacglnodjjndh-.*|teams-for-linux|teams|ms-teams)$"] title_format "<span font='JetBrainsMono Nerd Font 11' foreground='#74c7ec'>󰊻</span>   %title"
