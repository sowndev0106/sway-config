[package]
name = "eww-net"
version = "0.1.0"
edition = "2021"
description = "Wi-Fi and wired state/actions for the eww control center, straight over NetworkManager's D-Bus API"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"

[profile.release]
strip = true
